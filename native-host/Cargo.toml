[package]
name = "codex-firefox-bridge"
version = "1.0.1"
edition = "2021"
description = "Security-hardened native-messaging bridge for Zen Browser"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "0.22"
regex = "1.11"
serde_json = "1.0"
tempfile = "3.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
