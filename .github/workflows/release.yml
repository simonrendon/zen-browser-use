name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      check_auth:
        description: Check AMO credentials and add-on ownership without publishing
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  auth-check:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.check_auth == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify AMO credentials and add-on ownership
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/check-amo-auth.mjs

  verify:
    if: inputs.check_auth != true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: dist/*

  windows-companion:
    if: inputs.check_auth != true
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path native-host/Cargo.toml
      - run: cargo build --release --locked --manifest-path native-host/Cargo.toml
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $env:CODEX_FIREFOX_BRIDGE_VERSION = $version
          $env:CODEX_FIREFOX_BRIDGE_BINARY = (Resolve-Path native-host/target/release/codex-firefox-bridge.exe).Path
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/windows/codex-firefox-bridge.iss
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item installer/windows/Output/*.exe dist/
          Copy-Item native-host/target/release/codex-firefox-bridge.exe `
            "dist/codex-firefox-bridge-$version-windows-x64.exe"
      - name: Require Windows signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PFX) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Signed releases require WINDOWS_SIGNING_CERTIFICATE_PFX and WINDOWS_SIGNING_CERTIFICATE_PASSWORD.'
          }
      - name: Sign and verify Windows artifacts
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ env.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          SIGNING_PASSWORD: ${{ env.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP signing-certificate.pfx
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:SIGNING_PASSWORD (Get-ChildItem dist\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          & $signtool.FullName verify /pa /all (Get-ChildItem dist\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed.' }
      - name: Checksum Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          Get-FileHash dist/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content "dist/codex-firefox-bridge-$version-windows-x64.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-companion
          path: dist/*

  macos-companion:
    if: inputs.check_auth != true
    runs-on: macos-14
    env:
      MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
      MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_APPLICATION_CERTIFICATE_P12: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_P12 }}
      MACOS_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_PASSWORD }}
      MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --manifest-path native-host/Cargo.toml
      - run: cargo build --release --locked --manifest-path native-host/Cargo.toml --target aarch64-apple-darwin
      - run: cargo build --release --locked --manifest-path native-host/Cargo.toml --target x86_64-apple-darwin
      - name: Build universal package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          root="$RUNNER_TEMP/pkg-root"
          scripts="$RUNNER_TEMP/pkg-scripts"
          mkdir -p "$root/Library/Application Support/Secure Browser Use for Zen" "$scripts" dist
          lipo -create \
            native-host/target/aarch64-apple-darwin/release/codex-firefox-bridge \
            native-host/target/x86_64-apple-darwin/release/codex-firefox-bridge \
            -output "$root/Library/Application Support/Secure Browser Use for Zen/zen-browser-use-secure-bridge"
          cp "$root/Library/Application Support/Secure Browser Use for Zen/zen-browser-use-secure-bridge" \
            "dist/codex-firefox-bridge-$version-macos-universal"
          cp installer/macos/com.simonrendon.zen_browser_use_secure.json \
            "$root/Library/Application Support/Secure Browser Use for Zen/"
          cp installer/macos/scripts/postinstall "$scripts/postinstall"
          chmod 755 "$root/Library/Application Support/Secure Browser Use for Zen/zen-browser-use-secure-bridge" "$scripts/postinstall"
          pkgbuild \
            --root "$root" \
            --scripts "$scripts" \
            --ownership recommended \
            --identifier "com.simonrendon.zen-browser-use-secure" \
            --version "$version" \
            "dist/codex-firefox-bridge-$version-macos-universal.pkg"
      - name: Sign, notarize, and verify macOS artifacts
        shell: bash
        env:
          INSTALLER_CERTIFICATE: ${{ env.MACOS_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ env.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          INSTALLER_IDENTITY: ${{ env.MACOS_INSTALLER_IDENTITY }}
          APPLICATION_CERTIFICATE: ${{ env.MACOS_APPLICATION_CERTIFICATE_P12 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ env.MACOS_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLICATION_IDENTITY: ${{ env.MACOS_APPLICATION_IDENTITY }}
          APPLE_ID: ${{ env.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ env.MACOS_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ env.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in INSTALLER_CERTIFICATE INSTALLER_CERTIFICATE_PASSWORD INSTALLER_IDENTITY APPLICATION_CERTIFICATE APPLICATION_CERTIFICATE_PASSWORD APPLICATION_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            test -n "${!variable:-}" || { echo "Signed releases require $variable" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          installer_certificate="$RUNNER_TEMP/installer-certificate.p12"
          application_certificate="$RUNNER_TEMP/application-certificate.p12"
          echo "$INSTALLER_CERTIFICATE" | base64 --decode > "$installer_certificate"
          echo "$APPLICATION_CERTIFICATE" | base64 --decode > "$application_certificate"
          security create-keychain -p release "$keychain"
          security unlock-keychain -p release "$keychain"
          security import "$installer_certificate" -k "$keychain" -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security import "$application_certificate" -k "$keychain" -P "$APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k release "$keychain"
          version="$(node -p "require('./version.json').version")"
          binary="dist/codex-firefox-bridge-$version-macos-universal"
          codesign --force --options runtime --timestamp --sign "$APPLICATION_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          cp "$binary" "$RUNNER_TEMP/pkg-root/Library/Application Support/Secure Browser Use for Zen/zen-browser-use-secure-bridge"
          pkgbuild \
            --root "$RUNNER_TEMP/pkg-root" \
            --scripts "$RUNNER_TEMP/pkg-scripts" \
            --ownership recommended \
            --identifier "com.simonrendon.zen-browser-use-secure" \
            --version "$version" \
            "$RUNNER_TEMP/unsigned.pkg"
          package="dist/codex-firefox-bridge-$version-macos-universal.pkg"
          rm -f "$package"
          productsign --sign "$INSTALLER_IDENTITY" "$RUNNER_TEMP/unsigned.pkg" "$package"
          xcrun notarytool submit "$package" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$package"
          xcrun stapler validate "$package"
          pkgutil --check-signature "$package"
          spctl --assess --type install --verbose=2 "$package"
      - name: Checksum macOS package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          shasum -a 256 \
            dist/*.pkg \
            "dist/codex-firefox-bridge-$version-macos-universal" \
            > "dist/codex-firefox-bridge-$version-macos-universal.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-companion
          path: dist/*

  linux-companion:
    if: inputs.check_auth != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test
      - run: cargo test --manifest-path native-host/Cargo.toml
      - run: cargo build --release --locked --manifest-path native-host/Cargo.toml
      - name: Package Linux binary
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          mkdir -p dist
          cp native-host/target/release/codex-firefox-bridge \
            "dist/codex-firefox-bridge-${version}-linux-x64"
          chmod 755 "dist/codex-firefox-bridge-${version}-linux-x64"
          sha256sum "dist/codex-firefox-bridge-${version}-linux-x64" \
            > "dist/codex-firefox-bridge-${version}-linux-x64.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-companion
          path: dist/*

  npm-package:
    if: inputs.check_auth != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: npm
      - name: Pack npm installer
        run: |
          mkdir -p dist
          npm pack ./npm --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-installer
          path: dist/*.tgz

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [auth-check, verify, windows-companion, macos-companion, linux-companion, npm-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  publish-npm:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [npm-package, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish npm installer with provenance
        run: npm publish ./npm --access public --provenance

  release-smoke:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [publish, publish-npm]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify public release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          release="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          for asset in \
            "codex-firefox-bridge-${version}-windows-x64-setup.exe" \
            "codex-firefox-bridge-${version}-macos-universal.pkg" \
            "codex-firefox-bridge-${version}-macos-universal" \
            "codex-firefox-bridge-${version}-macos-universal.sha256" \
            "codex-firefox-bridge-${version}-linux-x64" \
            "codex-firefox-bridge-${version}-linux-x64.sha256"
          do
            curl --fail --location --silent --show-error --head "${release}/${asset}" >/dev/null
          done
      - name: Wait for npm registry propagation
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          for attempt in {1..12}; do
            if [ "$(npm view "zen-browser-use-secure-bridge@${version}" version 2>/dev/null || true)" = "$version" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "zen-browser-use-secure-bridge@${version} did not become available" >&2
          exit 1
      - name: Install the public companion from scratch
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          scratch="$(mktemp -d)"
          mkdir -p "$scratch/home" "$scratch/npm-cache"
          HOME="$scratch/home" \
            npm_config_cache="$scratch/npm-cache" \
            CODEX_FIREFOX_ORIGINAL_HOST="/usr/bin/true" \
            npx --yes "zen-browser-use-secure-bridge@${version}" install
          manifest="$scratch/home/Library/Application Support/Mozilla/NativeMessagingHosts/com.simonrendon.zen_browser_use_secure.json"
          test -f "$manifest"
          binary="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).path" "$manifest")"
          test "$("$binary" --version)" = "$version"

  linux-release-smoke:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [publish, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Wait for npm registry propagation
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          for attempt in {1..12}; do
            if [ "$(npm view "zen-browser-use-secure-bridge@${version}" version 2>/dev/null || true)" = "$version" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "zen-browser-use-secure-bridge@${version} did not become available" >&2
          exit 1
      - name: Install the public Linux companion from scratch
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          scratch="$(mktemp -d)"
          mkdir -p "$scratch/home" "$scratch/npm-cache"
          HOME="$scratch/home" \
            npm_config_cache="$scratch/npm-cache" \
            CODEX_FIREFOX_ORIGINAL_HOST="/usr/bin/true" \
            npx --yes "zen-browser-use-secure-bridge@${version}" install
          firefox_manifest="$scratch/home/.mozilla/native-messaging-hosts/com.simonrendon.zen_browser_use_secure.json"
          zen_manifest="$scratch/home/.zen/native-messaging-hosts/com.simonrendon.zen_browser_use_secure.json"
          test -f "$firefox_manifest"
          test -f "$zen_manifest"
          binary="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).path" "$firefox_manifest")"
          test "$("$binary" --version)" = "$version"
          zen_binary="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).path" "$zen_manifest")"
          test "$binary" = "$zen_binary"

  publish-amo:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [auth-check, release-smoke, linux-release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: firefox-extension
          path: dist
      - name: Prepare matching source and release notes
        run: node scripts/prepare-amo-metadata.mjs
      - name: Submit update to the existing Firefox Add-ons listing
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./version.json').version")"
          npx --yes web-ext@10.6.0 sign \
            --source-dir extension \
            --channel listed \
            --upload-source-code "dist/codex-computer-use-firefox-zen-${version}-source.zip" \
            --amo-metadata dist/amo-metadata.json \
            --approval-timeout 0 \
            --no-input
          echo "Submitted to AMO; Mozilla approval may still be pending." >> "$GITHUB_STEP_SUMMARY"
